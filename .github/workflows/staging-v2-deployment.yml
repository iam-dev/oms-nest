name: Deploy to Staging V2

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging-v2'
        type: choice
        options:
        - staging-v2
      force_deploy:
        description: 'Force clean resource wipe before deploy (does NOT bypass test failures — WF-005)'
        required: false
        default: false
        type: boolean

# Restrict permissions to the minimum required
permissions:
  contents: read
  packages: write
  id-token: write     # Required for OIDC token exchange with DigitalOcean
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend
  K8S_NAMESPACE: oms-nest-staging

jobs:
  # Security scanning and linting
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.28.0 (WF-007/WF-010)
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        exit-code: '0'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Backend build, test, and image creation
  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run type check
      run: npx tsc --noEmit

    - name: Build application
      run: npm run build

    - name: Run unit tests
      run: npm test -- --passWithNoTests --coverage
      # WF-005: continue-on-error override removed; force_deploy no longer bypasses test failures

    - name: Upload test coverage
      uses: codecov/codecov-action@v3 # TODO(WF-010): pin to commit SHA once SHA for v3 is verified
      with:
        files: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=staging-latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile.production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          NODE_ENV=staging

  # Frontend build, test, and image creation
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run type check
      run: npm run type-check

    - name: Run tests
      run: npm test
      # WF-005: continue-on-error override removed; force_deploy no longer bypasses test failures

    - name: Build application
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: https://api-nest-staging.ordermysaddle.com
        NODE_ENV: staging

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=staging-latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          NODE_ENV=staging
          NEXT_PUBLIC_API_URL=https://api-nest-staging.ordermysaddle.com

  # Deploy to Kubernetes oms-nest-staging namespace
  deploy-staging:
    name: Deploy to Staging V2
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    environment:
      name: staging-v2
      url: https://next-staging.ordermysaddle.com

    steps:
    - uses: actions/checkout@v4

    - name: Setup Kubernetes CLI
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl for DigitalOcean
      uses: digitalocean/action-doctl@v2 # TODO(WF-010): pin to commit SHA once SHA for v2 is verified
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Setup Kubernetes context
      run: doctl kubernetes cluster kubeconfig save ${{ secrets.DOKS_CLUSTER_NAME }}

    - name: Create namespace if not exists
      run: |
        kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Clean existing resources in namespace
      if: ${{ github.event.inputs.force_deploy == 'true' }}
      run: |
        # Only run on force deploy — incremental kubectl apply is preferred
        helm uninstall oms-nest-staging -n ${{ env.K8S_NAMESPACE }} || true
        kubectl delete deployments,services,statefulsets,configmaps,ingress,hpa --all -n ${{ env.K8S_NAMESPACE }} || true
        kubectl wait --for=delete pods --all -n ${{ env.K8S_NAMESPACE }} --timeout=120s || true

    - name: Install sealed-secrets controller
      # WF-006: idempotent install — skip reinstall if already running healthy.
      # Only reinstall when not present; use helm upgrade --install for safe upgrades.
      run: |
        helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets || true
        helm repo update

        if helm list -n kube-system | grep -q sealed-secrets; then
          echo "Sealed-secrets already installed, skipping reinstall"
        else
          # WF-004: no '|| true' — failures surface loudly
          helm install sealed-secrets sealed-secrets/sealed-secrets \
            --namespace kube-system \
            --set-string fullnameOverride=sealed-secrets-controller \
            --wait --timeout 300s
        fi

        # Wait for the controller to be ready regardless of install/skip path
        echo "Waiting for sealed-secrets controller to be ready..."
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=sealed-secrets \
          -n kube-system --timeout=300s

    - name: Apply SealedSecret from Git
      run: |
        kubectl apply -f kubernetes/staging-v2/sealed-secret.yaml

    - name: Wait for secret to be unsealed
      run: |
        echo "Waiting for sealed-secrets controller to decrypt oms-app-secrets..."
        for i in $(seq 1 30); do
          if kubectl get secret oms-app-secrets -n ${{ env.K8S_NAMESPACE }} > /dev/null 2>&1; then
            echo "oms-app-secrets decrypted successfully"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "::error::Timed out waiting for oms-app-secrets to be unsealed"
            kubectl get sealedsecret -n ${{ env.K8S_NAMESPACE }} -o yaml || true
            exit 1
          fi
          sleep 5
        done

    - name: Create registry credentials
      # WF-002: password passed via env var so it is not visible in /proc/*/cmdline
      env:
        DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        DOCKER_USERNAME: ${{ github.actor }}
        DOCKER_REGISTRY: ${{ env.REGISTRY }}
        K8S_NS: ${{ env.K8S_NAMESPACE }}
      run: |
        kubectl create secret docker-registry registry-credentials \
          --namespace="$K8S_NS" \
          --docker-server="$DOCKER_REGISTRY" \
          --docker-username="$DOCKER_USERNAME" \
          --docker-password="$DOCKER_PASSWORD" \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Verify secrets exist
      run: |
        echo "Verifying Kubernetes secrets exist..."
        for secret in oms-app-secrets registry-credentials; do
          if kubectl get secret "$secret" -n ${{ env.K8S_NAMESPACE }} > /dev/null 2>&1; then
            echo "  $secret [OK]"
          else
            echo "::error::Secret $secret was not found"
            exit 1
          fi
        done

    - name: Update image tags in K8s manifests
      run: |
        cd kubernetes/staging-v2

        # Update backend image tag
        sed -i "s|ghcr.io/YOUR_ORG/oms-backend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:staging-latest|g" backend-deployment.yaml

        # Update frontend image tag
        sed -i "s|ghcr.io/YOUR_ORG/oms-frontend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:staging-latest|g" frontend-deployment.yaml

    - name: Deploy Redis cache
      run: kubectl apply -f kubernetes/staging-v2/database-deployment.yaml

    - name: Wait for Redis to be ready
      run: |
        kubectl wait --namespace=${{ env.K8S_NAMESPACE }} \
          --for=condition=ready pod \
          --selector=app=oms-redis \
          --timeout=300s

    - name: Deploy backend application
      run: |
        kubectl apply -f kubernetes/staging-v2/backend-deployment.yaml
        kubectl rollout restart deployment/oms-backend --namespace=${{ env.K8S_NAMESPACE }}

    - name: Wait for backend to be ready
      run: |
        # Poll rollout status in short windows; if a pod sits in Terminating
        # because its node is degraded (disk-full / NotReady), force-delete it
        # so the rollout can complete instead of stalling for the full timeout.
        ns=${{ env.K8S_NAMESPACE }}
        deadline=$(( SECONDS + 600 ))
        while [ $SECONDS -lt $deadline ]; do
          remaining=$(( deadline - SECONDS ))
          window=$(( remaining < 60 ? remaining : 60 ))
          if kubectl rollout status deployment/oms-backend -n "$ns" --timeout=${window}s; then
            echo "✅ oms-backend rolled out"
            exit 0
          fi
          stuck=$(kubectl get pods -n "$ns" -l app=oms-backend \
            -o jsonpath='{range .items[?(@.metadata.deletionTimestamp!="")]}{.metadata.name}{"\n"}{end}')
          if [ -n "$stuck" ]; then
            echo "⚠️  Force-deleting Terminating pod(s): $stuck"
            echo "$stuck" | xargs -r -n1 kubectl delete pod -n "$ns" --force --grace-period=0 || true
          else
            echo "ℹ️  Rollout not complete yet, no Terminating pods to reap; retrying"
          fi
        done
        echo "::error::oms-backend rollout did not complete within 600s"
        echo "::group::Pods (wide)"
        kubectl get pods -n "$ns" -l app=oms-backend -o wide || true
        echo "::endgroup::"
        echo "::group::Deployment describe"
        kubectl describe deployment/oms-backend -n "$ns" || true
        echo "::endgroup::"
        echo "::group::ReplicaSets"
        kubectl get rs -n "$ns" -l app=oms-backend -o wide || true
        echo "::endgroup::"
        echo "::group::Pod describe (with Events)"
        for pod in $(kubectl get pods -n "$ns" -l app=oms-backend -o jsonpath='{.items[*].metadata.name}'); do
          echo "----- $pod -----"
          kubectl describe pod "$pod" -n "$ns" || true
        done
        echo "::endgroup::"
        echo "::group::Recent namespace events"
        kubectl get events -n "$ns" --sort-by=.lastTimestamp | tail -60 || true
        echo "::endgroup::"
        echo "::group::Pod logs (current + previous)"
        for pod in $(kubectl get pods -n "$ns" -l app=oms-backend -o jsonpath='{.items[*].metadata.name}'); do
          echo "----- $pod logs (current, tail 200) -----"
          kubectl logs -n "$ns" "$pod" --tail=200 --all-containers || true
          echo "----- $pod logs (previous, tail 200) -----"
          kubectl logs -n "$ns" "$pod" --previous --tail=200 --all-containers || true
        done
        echo "::endgroup::"
        echo "::group::Nodes hosting these pods"
        nodes=$(kubectl get pods -n "$ns" -l app=oms-backend -o jsonpath='{.items[*].spec.nodeName}' | tr ' ' '\n' | sort -u)
        for node in $nodes; do
          [ -z "$node" ] && continue
          echo "----- $node -----"
          kubectl describe node "$node" | sed -n '/^Conditions:/,/^[A-Z]/p' || true
        done
        echo "::endgroup::"
        exit 1

    - name: Run database migrations
      run: |
        echo "Checking for pending database migrations..."
        POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=oms-backend \
          -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.metadata.name}{"\t"}{.metadata.deletionTimestamp}{"\n"}{end}' \
          | awk -F'\t' '$2 == "" { print $1; exit }')
        if [ -z "$POD" ]; then
          echo "::error::No ready backend pod found for migrations"
          exit 1
        fi
        echo "Using backend pod: $POD"
        kubectl exec -n ${{ env.K8S_NAMESPACE }} "$POD" -- \
          node dist/src/database/run-migrations.js

    - name: Deploy frontend application
      run: |
        kubectl apply -f kubernetes/staging-v2/frontend-deployment.yaml
        kubectl rollout restart deployment/oms-frontend --namespace=${{ env.K8S_NAMESPACE }}

    - name: Wait for frontend to be ready
      run: |
        # Poll rollout status in short windows; if a pod sits in Terminating
        # because its node is degraded (disk-full / NotReady), force-delete it
        # so the rollout can complete instead of stalling for the full timeout.
        ns=${{ env.K8S_NAMESPACE }}
        deadline=$(( SECONDS + 600 ))
        while [ $SECONDS -lt $deadline ]; do
          remaining=$(( deadline - SECONDS ))
          window=$(( remaining < 60 ? remaining : 60 ))
          if kubectl rollout status deployment/oms-frontend -n "$ns" --timeout=${window}s; then
            echo "✅ oms-frontend rolled out"
            exit 0
          fi
          stuck=$(kubectl get pods -n "$ns" -l app=oms-frontend \
            -o jsonpath='{range .items[?(@.metadata.deletionTimestamp!="")]}{.metadata.name}{"\n"}{end}')
          if [ -n "$stuck" ]; then
            echo "⚠️  Force-deleting Terminating pod(s): $stuck"
            echo "$stuck" | xargs -r -n1 kubectl delete pod -n "$ns" --force --grace-period=0 || true
          else
            echo "ℹ️  Rollout not complete yet, no Terminating pods to reap; retrying"
          fi
        done
        echo "::error::oms-frontend rollout did not complete within 600s"
        echo "::group::Pods (wide)"
        kubectl get pods -n "$ns" -l app=oms-frontend -o wide || true
        echo "::endgroup::"
        echo "::group::Deployment describe"
        kubectl describe deployment/oms-frontend -n "$ns" || true
        echo "::endgroup::"
        echo "::group::ReplicaSets"
        kubectl get rs -n "$ns" -l app=oms-frontend -o wide || true
        echo "::endgroup::"
        echo "::group::Pod describe (with Events)"
        for pod in $(kubectl get pods -n "$ns" -l app=oms-frontend -o jsonpath='{.items[*].metadata.name}'); do
          echo "----- $pod -----"
          kubectl describe pod "$pod" -n "$ns" || true
        done
        echo "::endgroup::"
        echo "::group::Recent namespace events"
        kubectl get events -n "$ns" --sort-by=.lastTimestamp | tail -60 || true
        echo "::endgroup::"
        echo "::group::Pod logs (current + previous)"
        for pod in $(kubectl get pods -n "$ns" -l app=oms-frontend -o jsonpath='{.items[*].metadata.name}'); do
          echo "----- $pod logs (current, tail 200) -----"
          kubectl logs -n "$ns" "$pod" --tail=200 --all-containers || true
          echo "----- $pod logs (previous, tail 200) -----"
          kubectl logs -n "$ns" "$pod" --previous --tail=200 --all-containers || true
        done
        echo "::endgroup::"
        echo "::group::Nodes hosting these pods"
        nodes=$(kubectl get pods -n "$ns" -l app=oms-frontend -o jsonpath='{.items[*].spec.nodeName}' | tr ' ' '\n' | sort -u)
        for node in $nodes; do
          [ -z "$node" ] && continue
          echo "----- $node -----"
          kubectl describe node "$node" | sed -n '/^Conditions:/,/^[A-Z]/p' || true
        done
        echo "::endgroup::"
        exit 1

    - name: Deploy ingress configuration
      run: kubectl apply -f kubernetes/staging-v2/ingress.yaml

    - name: Verify deployment
      run: |
        kubectl get pods --namespace=${{ env.K8S_NAMESPACE }}
        kubectl get services --namespace=${{ env.K8S_NAMESPACE }}
        kubectl get ingress --namespace=${{ env.K8S_NAMESPACE }}

    - name: Wait for services to be reachable
      run: |
        echo "Waiting for ingress and TLS to be ready..."

        # Wait for backend API health endpoint
        for i in $(seq 1 60); do
          if curl -sf --max-time 5 https://api-nest-staging.ordermysaddle.com/api/health > /dev/null 2>&1; then
            echo "✅ Backend API is reachable"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "::error::Backend API not reachable after 5 minutes"
            exit 1
          fi
          echo "⏳ Waiting for backend API (attempt $i/60)..."
          sleep 5
        done

        # Wait for frontend
        for i in $(seq 1 60); do
          if curl -sf --max-time 5 https://next-staging.ordermysaddle.com > /dev/null 2>&1; then
            echo "✅ Frontend is reachable"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "::error::Frontend not reachable after 5 minutes"
            exit 1
          fi
          echo "⏳ Waiting for frontend (attempt $i/60)..."
          sleep 5
        done

        echo "✅ All services are reachable"

  # E2E tests against deployed staging environment
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    defaults:
      run:
        working-directory: ./e2e

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    # kubectl access for creating/deleting test users in the staging database
    - name: Configure kubectl for DigitalOcean
      uses: digitalocean/action-doctl@v2 # TODO(WF-010): pin to commit SHA once SHA for v2 is verified
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Setup Kubernetes context
      run: doctl kubernetes cluster kubeconfig save ${{ secrets.DOKS_CLUSTER_NAME }}
      working-directory: .

    - name: Generate E2E test passwords
      id: e2e-creds
      run: |
        E2E_ADMIN_PASSWORD="$(openssl rand -hex 16)Aa1@"
        E2E_FITTER_PASSWORD="$(openssl rand -hex 16)Ft1@"
        echo "::add-mask::$E2E_ADMIN_PASSWORD"
        echo "::add-mask::$E2E_FITTER_PASSWORD"
        echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD" >> "$GITHUB_OUTPUT"
        echo "E2E_FITTER_PASSWORD=$E2E_FITTER_PASSWORD" >> "$GITHUB_OUTPUT"

    - name: Wait for old pods to terminate
      working-directory: .
      run: |
        echo "Waiting for any terminating pods to finish..."
        for i in $(seq 1 30); do
          TERMINATING=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=oms-backend \
            -o jsonpath='{range .items[*]}{.metadata.deletionTimestamp}{"\n"}{end}' | grep -c . || true)
          if [ "$TERMINATING" -eq 0 ]; then
            echo "All backend pods are stable"
            break
          fi
          echo "⏳ $TERMINATING pod(s) still terminating (attempt $i/30)..."
          sleep 5
        done

    - name: Create E2E test users on staging
      # WF-003/WF-012: script extracted to file; passwords passed via --env so they
      # are not interpolated into the shell command line (not visible in /proc/*/cmdline).
      working-directory: .
      env:
        E2E_ADMIN_PASSWORD: ${{ steps.e2e-creds.outputs.E2E_ADMIN_PASSWORD }}
        E2E_FITTER_PASSWORD: ${{ steps.e2e-creds.outputs.E2E_FITTER_PASSWORD }}
        K8S_NS: ${{ env.K8S_NAMESPACE }}
      run: |
        # Select a Running pod that is NOT being terminated
        POD=$(kubectl get pods -n "$K8S_NS" -l app=oms-backend \
          -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.metadata.name}{"\t"}{.metadata.deletionTimestamp}{"\n"}{end}' \
          | awk -F'\t' '$2 == "" { print $1; exit }')
        if [ -z "$POD" ]; then
          echo "::error::No ready backend pod found"
          kubectl get pods -n "$K8S_NS" -l app=oms-backend
          exit 1
        fi
        echo "Using backend pod: $POD"
        # Pipe the script via stdin (-i) so it never appears on the process command line.
        # Passwords are forwarded as env vars — not shell-interpolated into the script text.
        kubectl exec -n "$K8S_NS" "$POD" -i \
          --env="E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD" \
          --env="E2E_FITTER_PASSWORD=$E2E_FITTER_PASSWORD" \
          -- node - < .github/workflows/scripts/e2e-create-users.js

    - name: Run E2E tests
      # NOTE: Staging E2E tests are smoke/readonly only (enforced by playwright.config.ts grep filter)
      run: npx playwright test
      env:
        ENVIRONMENT: staging
        STAGING_BASE_URL: https://next-staging.ordermysaddle.com
        STAGING_API_URL: https://api-nest-staging.ordermysaddle.com
        TEST_ADMIN_EMAIL: e2e-admin@test.com
        TEST_ADMIN_PASSWORD: ${{ steps.e2e-creds.outputs.E2E_ADMIN_PASSWORD }}
        TEST_FITTER_EMAIL: e2e-fitter@test.com
        TEST_FITTER_PASSWORD: ${{ steps.e2e-creds.outputs.E2E_FITTER_PASSWORD }}

    - name: Delete E2E test users from staging
      # WF-003: script extracted to file; no secrets needed for deletion
      if: always()
      working-directory: .
      env:
        K8S_NS: ${{ env.K8S_NAMESPACE }}
      run: |
        POD=$(kubectl get pods -n "$K8S_NS" -l app=oms-backend \
          -o jsonpath='{range .items[?(@.status.phase=="Running")]}{.metadata.name}{"\t"}{.metadata.deletionTimestamp}{"\n"}{end}' \
          | awk -F'\t' '$2 == "" { print $1; exit }' 2>/dev/null || true)
        if [ -z "$POD" ]; then
          echo "No ready backend pod found, skipping cleanup"
          exit 0
        fi
        echo "Cleaning up test users from pod: $POD"
        kubectl exec -n "$K8S_NS" "$POD" -i \
          -- node - < .github/workflows/scripts/e2e-delete-users.js \
          || echo "Warning: test user cleanup failed (non-fatal)"

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results-v2
        path: e2e/test-results/
        retention-days: 7

  # Rollback on E2E failure
  rollback:
    name: Rollback on E2E Failure
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: failure()

    steps:
    - name: Configure kubectl for DigitalOcean
      uses: digitalocean/action-doctl@v2 # TODO(WF-010): pin to commit SHA once SHA for v2 is verified
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Setup Kubernetes context
      run: doctl kubernetes cluster kubeconfig save ${{ secrets.DOKS_CLUSTER_NAME }}

    - name: Rollback deployments
      run: |
        echo "E2E tests failed, rolling back deployments..."
        kubectl rollout undo deployment/oms-backend -n ${{ env.K8S_NAMESPACE }}
        kubectl rollout undo deployment/oms-frontend -n ${{ env.K8S_NAMESPACE }}
        kubectl rollout status deployment/oms-backend -n ${{ env.K8S_NAMESPACE }} --timeout=600s
        kubectl rollout status deployment/oms-frontend -n ${{ env.K8S_NAMESPACE }} --timeout=600s
        echo "Rollback completed"
