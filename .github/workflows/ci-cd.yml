name: 🚀 OMS DevSecOps Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

# WF-029: minimum permissions at workflow level; jobs that need broader access
# (security-events write, packages write) declare their own permissions block.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: iam-dev/oms-nest-backend
  IMAGE_NAME_FRONTEND: iam-dev/oms-nest-frontend
  SECURITY_SCAN_ENABLED: true
  E2E_TESTING_ENABLED: true

jobs:
  # 🔐 Security and Secret Scanning (First Line of Defense)
  security-scan:
    runs-on: ubuntu-latest
    name: 🔍 Security & Secret Scanning
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Fetch full history for security scanning
          fetch-depth: 0

      - name: 🔍 GitLeaks Secret Detection
        uses: gitleaks/gitleaks-action@v2 # TODO(WF-010): pin to commit SHA once SHA for v2 is verified
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: 🛡️ Trivy Filesystem Security Scan
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0 (Docker action; later versions require setup-trivy@v0.2.x which is missing upstream — WF-007/WF-010)
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📊 Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      # WF-017: CodeQL removed here — codeql.yml is the canonical workflow.
      # Running it inline as well caused triple execution on every push to staging.

  # 🧪 Dependency and License Scanning
  dependency-scan:
    runs-on: ubuntu-latest
    name: 📦 Dependency & License Audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: 📦 Backend Dependency Audit
        working-directory: backend
        run: |
          npm ci
          npm audit --omit=dev || true
          audit_json=$(npm audit --omit=dev --json || true)
          critical=$(echo "$audit_json" | jq '.metadata.vulnerabilities.critical // 0')
          high=$(echo "$audit_json" | jq '.metadata.vulnerabilities.high // 0')
          echo "Production vulnerabilities — critical: $critical, high: $high"
          # Generate the dependency report BEFORE the gate below. The gate
          # `exit 1`s, so writing the report after it meant the report was
          # never produced on precisely the runs that failed — and the upload
          # step then warned "No files were found". The report is the artifact
          # you most want when the audit fails, so write it unconditionally.
          # `npm list` exits non-zero on any peer/version mismatch anywhere in
          # the tree, so soft-fail it the same way as `npm audit`: still write
          # the JSON (which will include a `problems` field), but don't fail CI.
          npm list --all --json > dependency-report.json || true
          if [ "$((critical + high))" -gt 0 ]; then
            echo "::error::Found $critical critical and $high high severity production vulnerabilities"
            exit 1
          fi

      - name: 📦 Frontend Dependency Audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev || true
          audit_json=$(npm audit --omit=dev --json || true)
          critical=$(echo "$audit_json" | jq '.metadata.vulnerabilities.critical // 0')
          high=$(echo "$audit_json" | jq '.metadata.vulnerabilities.high // 0')
          echo "Production vulnerabilities — critical: $critical, high: $high"
          if [ "$((critical + high))" -gt 0 ]; then
            echo "::error::Found $critical critical and $high high severity production vulnerabilities"
            exit 1
          fi

      - name: 📦 E2E Dependencies Audit
        working-directory: e2e
        run: |
          npm ci
          npm audit --omit=dev || true
          audit_json=$(npm audit --omit=dev --json || true)
          critical=$(echo "$audit_json" | jq '.metadata.vulnerabilities.critical // 0')
          high=$(echo "$audit_json" | jq '.metadata.vulnerabilities.high // 0')
          echo "Production vulnerabilities — critical: $critical, high: $high"
          if [ "$((critical + high))" -gt 0 ]; then
            echo "::error::Found $critical critical and $high high severity production vulnerabilities"
            exit 1
          fi

      - name: 📊 Upload Dependency Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-reports
          # NOTE: `security-report.json` was listed here but no step in this
          # workflow ever produced it, which is why the upload warned about
          # missing files. Only list paths that are actually generated.
          path: backend/dependency-report.json
          if-no-files-found: warn

  # Backend testing (NestJS)
  test-backend:
    runs-on: ubuntu-latest
    name: 🧪 Test NestJS Backend
    needs: [security-scan, dependency-scan]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oms_test
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run linting
        working-directory: backend
        run: npm run lint

      - name: Run unit tests
        working-directory: backend
        run: npm run test
        env:
          DATABASE_URL: postgresql://oms:test_password@localhost:5432/oms_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Run database migrations
        working-directory: backend
        run: npx ts-node -r tsconfig-paths/register ./node_modules/typeorm/cli.js --dataSource=src/database/data-source.ts migration:run
        env:
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USERNAME: oms
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: oms_test
          DATABASE_SYNCHRONIZE: "false"
          NODE_ENV: test

      - name: Run integration tests
        working-directory: backend
        run: npx jest --config ./test/e2e-api/jest.e2e-api.config.js --testPathPatterns='api-endpoints'
        env:
          NODE_ENV: test
          # BE-007: MailService.onModuleInit fails hard on undefined/malformed
          # frontendDomain. dotenv only fills unset vars, so set it explicitly.
          FRONTEND_DOMAIN: http://localhost:3002
          E2E_DATABASE_HOST: localhost
          E2E_DATABASE_PORT: "5432"
          E2E_DATABASE_USERNAME: oms
          E2E_DATABASE_PASSWORD: test_password
          E2E_DATABASE_NAME: oms_test
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USERNAME: oms
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: oms_test
          DATABASE_SYNCHRONIZE: "false"
          E2E_REDIS_HOST: localhost
          E2E_REDIS_PORT: "6379"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          AUTH_JWT_SECRET: ci-test-jwt-secret
          AUTH_JWT_TOKEN_EXPIRES_IN: 15m
          AUTH_REFRESH_SECRET: ci-test-refresh-secret
          AUTH_REFRESH_TOKEN_EXPIRES_IN: 7d
          AUTH_FORGOT_SECRET: ci-test-forgot-secret
          AUTH_FORGOT_TOKEN_EXPIRES_IN: 30m
          AUTH_CONFIRM_EMAIL_SECRET: ci-test-confirm-secret
          AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
          FILE_DRIVER: local
          MAIL_HOST: localhost
          MAIL_DEFAULT_EMAIL: test@example.com
          MAIL_DEFAULT_NAME: OMS Test
          MAIL_IGNORE_TLS: "true"
          MAIL_SECURE: "false"
          MAIL_REQUIRE_TLS: "false"

      - name: Upload backend test coverage
        uses: codecov/codecov-action@v3 # TODO(WF-010): pin to commit SHA once SHA for v3 is verified
        with:
          directory: backend/coverage
          flags: backend

  # Frontend testing (Next.js)
  test-frontend:
    runs-on: ubuntu-latest
    name: 🎨 Test Next.js Frontend
    needs: [security-scan, dependency-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend test coverage
        uses: codecov/codecov-action@v3 # TODO(WF-010): pin to commit SHA once SHA for v3 is verified
        with:
          directory: frontend/coverage
          flags: frontend

  # 🎭 Comprehensive End-to-End Testing with Playwright
  test-e2e:
    runs-on: ubuntu-latest
    name: 🎭 Comprehensive E2E Tests
    needs: [test-backend, test-frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oms_test
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        # Test across multiple browser engines for comprehensive coverage
        project: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: 🏗️ Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: 🎨 Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: 🎭 Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: 🎭 Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: 🗃️ Run database migrations
        working-directory: backend
        run: npx ts-node -r tsconfig-paths/register ./node_modules/typeorm/cli.js --dataSource=src/database/data-source.ts migration:run
        env:
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USERNAME: oms
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: oms_test
          DATABASE_SYNCHRONIZE: "false"
          NODE_ENV: test

      - name: 🌱 Seed test data
        working-directory: backend
        run: npx ts-node -r tsconfig-paths/register ./src/database/seeds/relational/run-seed.ts
        env:
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USERNAME: oms
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: oms_test
          NODE_ENV: test

      - name: 🚀 Start backend services
        working-directory: backend
        # WF-022: TODO(WF-022): start:dev used here; evaluate switching to start:prod
        # once CI env vars and build artefacts are confirmed compatible.
        # WF-024: trap EXIT so the background process is always killed even if a
        # later step in this shell exits non-zero before the Cleanup step runs.
        run: |
          _cleanup_backend() { [ -f backend.pid ] && kill "$(cat backend.pid)" 2>/dev/null || true; }
          trap _cleanup_backend EXIT
          npm run start:dev &
          echo $! > backend.pid
          # WF-023: replaced sleep 30 with a poll loop matching pr-checks.yml pattern
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health | grep -q "200"; then
              echo "Backend is ready!"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Backend failed to start within 60 attempts"
              exit 1
            fi
            echo "Attempt $i: Backend not ready yet, waiting 5s..."
            sleep 5
          done
        env:
          DATABASE_URL: postgresql://oms:test_password@localhost:5432/oms_test
          REDIS_URL: redis://localhost:6379/1
          NODE_ENV: test
          PORT: 3001
          # BE-007: MailService.onModuleInit rejects undefined/malformed URL.
          FRONTEND_DOMAIN: http://localhost:3000
          # BE-028: cookie `secure` defaults to true in non-development envs, but
          # this job serves the backend over plain http://localhost:3001, so a
          # Secure cookie would never be resent by Playwright's cookie jar and
          # every authed follow-up would 401 through the RLS guard (issue #90).
          COOKIE_SECURE: 'false'
          FILE_DRIVER: local
          AUTH_JWT_SECRET: ci-test-jwt-secret
          AUTH_JWT_TOKEN_EXPIRES_IN: 15m
          AUTH_REFRESH_SECRET: ci-test-refresh-secret
          AUTH_REFRESH_TOKEN_EXPIRES_IN: 7d
          AUTH_FORGOT_SECRET: ci-test-forgot-secret
          AUTH_FORGOT_TOKEN_EXPIRES_IN: 30m
          AUTH_CONFIRM_EMAIL_SECRET: ci-test-confirm-secret
          AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
          MAIL_HOST: localhost
          MAIL_DEFAULT_EMAIL: test@example.com
          MAIL_DEFAULT_NAME: OMS Test
          MAIL_IGNORE_TLS: 'true'
          MAIL_SECURE: 'false'
          MAIL_REQUIRE_TLS: 'false'

      - name: 🎨 Start frontend services
        working-directory: frontend
        # WF-024: trap EXIT so the background frontend process is always killed.
        run: |
          _cleanup_frontend() { [ -f frontend.pid ] && kill "$(cat frontend.pid)" 2>/dev/null || true; }
          trap _cleanup_frontend EXIT
          npm run dev &
          echo $! > frontend.pid
          echo "Waiting for frontend to be ready..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -qE "^[23]"; then
              echo "Frontend is ready!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Frontend failed to start within 30 attempts"
              exit 1
            fi
            echo "Attempt $i: Frontend not ready yet, waiting 5s..."
            sleep 5
          done
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: test
          PORT: 3000
          # The middleware verifies the httpOnly `token` cookie with JWT_SECRET
          # and fails closed when it is unset, bouncing every protected route to
          # /login even for a valid session. It must match the secret the
          # backend signs with (AUTH_JWT_SECRET above). Staging wires this the
          # same way in kubernetes/staging-v2/frontend-deployment.yaml.
          JWT_SECRET: ci-test-jwt-secret

      - name: 🔍 Verify services are running
        run: |
          echo "Checking backend health..."
          curl -f http://localhost:3001/api/health || exit 1
          echo "Checking frontend..."
          curl -f http://localhost:3000 || exit 1

      - name: 🎭 Run comprehensive E2E tests
        working-directory: e2e
        run: |
          echo "🚀 Running E2E tests for ${{ matrix.project }}"
          npx playwright test --project=${{ matrix.project }}
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:3001
          ENVIRONMENT: local
          CI: true

      - name: 🎭 Run smoke tests (critical path)
        if: matrix.project == 'chromium'
        working-directory: e2e
        run: npx playwright test --grep="@smoke"
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:3001

      - name: 🔒 Run security-focused tests
        if: matrix.project == 'chromium'
        working-directory: e2e
        run: npx playwright test --grep="@security"
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:3001

      - name: 📊 Upload E2E test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-test-results-${{ matrix.project }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/test-output/
          retention-days: 7

      - name: 📊 Upload HTML reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: e2e/test-results/html-report/
          retention-days: 30

      - name: 🧹 Cleanup processes
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi
          if [ -f frontend/frontend.pid ]; then
            kill $(cat frontend/frontend.pid) || true
          fi

  # 🐳 Build and push Docker images with security scanning
  build-and-push:
    runs-on: ubuntu-latest
    name: 🐳 Build & Push Secure Images
    needs: [security-scan, dependency-scan, test-backend, test-frontend, test-e2e]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.production
            image_name: iam-dev/oms-nest-backend
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image_name: iam-dev/oms-nest-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set build variables
        id: vars
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.image_tag }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image_name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.service == 'frontend' && format('NEXT_PUBLIC_API_URL=https://api-nest-{0}.ordermysaddle.com', github.ref == 'refs/heads/main' && 'production' || 'staging') || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0 (Docker action; later versions require setup-trivy@v0.2.x which is missing upstream — WF-007/WF-010)
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image_name }}:scan
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # WF-008/WF-009: The scan above is amd64-only; the push below previously included
      # linux/arm64 — meaning the arm64 layer was never scanned before publish.
      # Safer partial fix: restrict publish to linux/amd64 so scan == publish.
      # TODO(WF-008): proper fix is: build once → push by digest → scan by digest →
      # re-tag (single buildx bake run). Implement in a follow-up branch when arm64
      # is required by infra, to avoid a rushed multi-arch rebuild here.
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.service == 'frontend' && format('NEXT_PUBLIC_API_URL=https://api-nest-{0}.ordermysaddle.com', github.ref == 'refs/heads/main' && 'production' || 'staging') || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
