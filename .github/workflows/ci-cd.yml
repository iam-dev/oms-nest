name: 🚀 OMS DevSecOps Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: iam-dev/oms-nest-backend
  IMAGE_NAME_FRONTEND: iam-dev/oms-nest-frontend
  SECURITY_SCAN_ENABLED: true
  E2E_TESTING_ENABLED: true

jobs:
  # 🔐 Security and Secret Scanning (First Line of Defense)
  security-scan:
    runs-on: ubuntu-latest
    name: 🔍 Security & Secret Scanning
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history for security scanning
          fetch-depth: 0

      - name: 🔍 GitLeaks Secret Detection
        uses: gitleaks/gitleaks-action@v2 # TODO(WF-010): pin to commit SHA once SHA for v2 is verified
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: 🛡️ Trivy Filesystem Security Scan
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.28.0 (WF-007/WF-010)
        if: always()
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📊 Upload Trivy Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: 🔎 SAST with CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: typescript, javascript

      - name: 🔍 CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # 🧪 Dependency and License Scanning
  dependency-scan:
    runs-on: ubuntu-latest
    name: 📦 Dependency & License Audit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: 📦 Backend Dependency Audit
        working-directory: backend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical
          # Generate dependency report
          npm list --all --json > dependency-report.json

      - name: 📦 Frontend Dependency Audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical

      - name: 📦 E2E Dependencies Audit
        working-directory: e2e
        run: |
          npm ci
          npm audit --omit=dev --audit-level=critical

      - name: 📊 Upload Dependency Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports
          path: |
            backend/dependency-report.json
            security-report.json

  # Backend testing (NestJS)
  test-backend:
    runs-on: ubuntu-latest
    name: 🧪 Test NestJS Backend
    needs: [security-scan, dependency-scan]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oms_test
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run linting
        working-directory: backend
        run: npm run lint

      - name: Run unit tests
        working-directory: backend
        run: npm run test
        env:
          DATABASE_URL: postgresql://oms:test_password@localhost:5432/oms_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Run database migrations
        working-directory: backend
        run: npx ts-node -r tsconfig-paths/register ./node_modules/typeorm/cli.js --dataSource=src/database/data-source.ts migration:run
        env:
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USERNAME: oms
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: oms_test
          DATABASE_SYNCHRONIZE: "false"
          NODE_ENV: test

      - name: Run integration tests
        working-directory: backend
        run: npx jest --config ./test/e2e-api/jest.e2e-api.config.js --testPathPatterns='api-endpoints'
        env:
          NODE_ENV: test
          E2E_DATABASE_HOST: localhost
          E2E_DATABASE_PORT: "5432"
          E2E_DATABASE_USERNAME: oms
          E2E_DATABASE_PASSWORD: test_password
          E2E_DATABASE_NAME: oms_test
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USERNAME: oms
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: oms_test
          DATABASE_SYNCHRONIZE: "false"
          E2E_REDIS_HOST: localhost
          E2E_REDIS_PORT: "6379"
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          AUTH_JWT_SECRET: ci-test-jwt-secret
          AUTH_JWT_TOKEN_EXPIRES_IN: 15m
          AUTH_REFRESH_SECRET: ci-test-refresh-secret
          AUTH_REFRESH_TOKEN_EXPIRES_IN: 7d
          AUTH_FORGOT_SECRET: ci-test-forgot-secret
          AUTH_FORGOT_TOKEN_EXPIRES_IN: 30m
          AUTH_CONFIRM_EMAIL_SECRET: ci-test-confirm-secret
          AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
          FILE_DRIVER: local
          MAIL_HOST: localhost
          MAIL_DEFAULT_EMAIL: test@example.com
          MAIL_DEFAULT_NAME: OMS Test
          MAIL_IGNORE_TLS: "true"
          MAIL_SECURE: "false"
          MAIL_REQUIRE_TLS: "false"

      - name: Upload backend test coverage
        uses: codecov/codecov-action@v3 # TODO(WF-010): pin to commit SHA once SHA for v3 is verified
        with:
          directory: backend/coverage
          flags: backend

  # Frontend testing (Next.js)
  test-frontend:
    runs-on: ubuntu-latest
    name: 🎨 Test Next.js Frontend
    needs: [security-scan, dependency-scan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run linting
        working-directory: frontend
        run: npm run lint

      - name: Run unit tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend test coverage
        uses: codecov/codecov-action@v3 # TODO(WF-010): pin to commit SHA once SHA for v3 is verified
        with:
          directory: frontend/coverage
          flags: frontend

  # 🎭 Comprehensive End-to-End Testing with Playwright
  test-e2e:
    runs-on: ubuntu-latest
    name: 🎭 Comprehensive E2E Tests
    needs: [test-backend, test-frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oms_test
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        # Test across multiple browser engines for comprehensive coverage
        project: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: 🏗️ Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: 🎨 Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: 🎭 Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: 🎭 Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: 🗃️ Run database migrations
        working-directory: backend
        run: npx ts-node -r tsconfig-paths/register ./node_modules/typeorm/cli.js --dataSource=src/database/data-source.ts migration:run
        env:
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USERNAME: oms
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: oms_test
          DATABASE_SYNCHRONIZE: "false"
          NODE_ENV: test

      - name: 🌱 Seed test data
        working-directory: backend
        run: npx ts-node -r tsconfig-paths/register ./src/database/seeds/relational/run-seed.ts
        env:
          DATABASE_TYPE: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USERNAME: oms
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: oms_test
          NODE_ENV: test

      - name: 🚀 Start backend services
        working-directory: backend
        run: |
          npm run start:dev &
          echo $! > backend.pid
          sleep 30
        env:
          DATABASE_URL: postgresql://oms:test_password@localhost:5432/oms_test
          REDIS_URL: redis://localhost:6379/1
          NODE_ENV: test
          PORT: 3001
          FILE_DRIVER: local
          AUTH_JWT_SECRET: ci-test-jwt-secret
          AUTH_JWT_TOKEN_EXPIRES_IN: 15m
          AUTH_REFRESH_SECRET: ci-test-refresh-secret
          AUTH_REFRESH_TOKEN_EXPIRES_IN: 7d
          AUTH_FORGOT_SECRET: ci-test-forgot-secret
          AUTH_FORGOT_TOKEN_EXPIRES_IN: 30m
          AUTH_CONFIRM_EMAIL_SECRET: ci-test-confirm-secret
          AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
          MAIL_HOST: localhost
          MAIL_DEFAULT_EMAIL: test@example.com
          MAIL_DEFAULT_NAME: OMS Test
          MAIL_IGNORE_TLS: 'true'
          MAIL_SECURE: 'false'
          MAIL_REQUIRE_TLS: 'false'

      - name: 🎨 Start frontend services
        working-directory: frontend
        run: |
          npm run dev &
          echo $! > frontend.pid
          sleep 15
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: test
          PORT: 3000

      - name: 🔍 Verify services are running
        run: |
          echo "🔍 Checking backend health..."
          curl -f http://localhost:3001/api/health || exit 1
          echo "🔍 Checking frontend..."
          curl -f http://localhost:3000 || exit 1

      - name: 🎭 Run comprehensive E2E tests
        working-directory: e2e
        run: |
          echo "🚀 Running E2E tests for ${{ matrix.project }}"
          npx playwright test --project=${{ matrix.project }}
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:3001
          ENVIRONMENT: local
          CI: true

      - name: 🎭 Run smoke tests (critical path)
        if: matrix.project == 'chromium'
        working-directory: e2e
        run: npx playwright test --grep="@smoke"
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:3001

      - name: 🔒 Run security-focused tests
        if: matrix.project == 'chromium'
        working-directory: e2e
        run: npx playwright test --grep="@security"
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:3001

      - name: 📊 Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results-${{ matrix.project }}
          path: |
            e2e/test-results/
            e2e/playwright-report/
            e2e/test-output/
          retention-days: 7

      - name: 📊 Upload HTML reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: e2e/test-results/html-report/
          retention-days: 30

      - name: 🧹 Cleanup processes
        if: always()
        run: |
          if [ -f backend/backend.pid ]; then
            kill $(cat backend/backend.pid) || true
          fi
          if [ -f frontend/frontend.pid ]; then
            kill $(cat frontend/frontend.pid) || true
          fi

  # 🐳 Build and push Docker images with security scanning
  build-and-push:
    runs-on: ubuntu-latest
    name: 🐳 Build & Push Secure Images
    needs: [security-scan, dependency-scan, test-backend, test-frontend, test-e2e]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [backend, frontend]
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile.production
            image_name: iam-dev/oms-nest-backend
          - service: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image_name: iam-dev/oms-nest-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set build variables
        id: vars
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          IMAGE_TAG="${BRANCH_NAME}-${SHORT_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.image_tag }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY }}/${{ matrix.image_name }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.service == 'frontend' && format('NEXT_PUBLIC_API_URL=https://api-nest-{0}.ordermysaddle.com', github.ref == 'refs/heads/main' && 'production' || 'staging') || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.28.0 (WF-007/WF-010)
        with:
          image-ref: ${{ env.REGISTRY }}/${{ matrix.image_name }}:scan
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # WF-008/WF-009: The scan above is amd64-only; the push below previously included
      # linux/arm64 — meaning the arm64 layer was never scanned before publish.
      # Safer partial fix: restrict publish to linux/amd64 so scan == publish.
      # TODO(WF-008): proper fix is: build once → push by digest → scan by digest →
      # re-tag (single buildx bake run). Implement in a follow-up branch when arm64
      # is required by infra, to avoid a rushed multi-arch rebuild here.
      - name: Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.service == 'frontend' && format('NEXT_PUBLIC_API_URL=https://api-nest-{0}.ordermysaddle.com', github.ref == 'refs/heads/main' && 'production' || 'staging') || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
