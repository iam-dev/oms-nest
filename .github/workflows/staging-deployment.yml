name: Deploy to Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: false
        type: boolean

# Restrict permissions to the minimum required
permissions:
  contents: read
  packages: write
  id-token: write     # Required for OIDC token exchange with DigitalOcean
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend
  K8S_NAMESPACE: oms-nest-staging

jobs:
  # Security scanning and linting
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # Backend build, test, and image creation
  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run type check
      run: npx tsc --noEmit

    - name: Build application
      run: npm run build

    - name: Run unit tests
      run: npm test -- --passWithNoTests --coverage
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}

    - name: Upload test coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage/lcov.info
        flags: backend
        name: backend-coverage

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=staging-latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        file: ./backend/Dockerfile.production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          NODE_ENV=staging

  # Frontend build, test, and image creation
  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: security-scan
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run type check
      run: npm run type-check

    - name: Run tests
      run: npm test
      continue-on-error: ${{ github.event.inputs.force_deploy == 'true' }}

    - name: Build application
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: https://api-nest-staging.ordermysaddle.com
        NODE_ENV: staging

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix=sha-
          type=raw,value=staging-latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          NODE_ENV=staging
          NEXT_PUBLIC_API_URL=https://api-nest-staging.ordermysaddle.com

  # Deploy to Kubernetes oms-nest-staging namespace
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    environment:
      name: staging
      url: https://next-staging.ordermysaddle.com

    steps:
    - uses: actions/checkout@v4

    - name: Setup Kubernetes CLI
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'

    - name: Configure kubectl for DigitalOcean
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Setup Kubernetes context
      run: doctl kubernetes cluster kubeconfig save k8s-1-28-6-do-0-ams3-1713552913551

    - name: Create namespace if not exists
      run: |
        kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Clean existing resources in namespace
      if: ${{ github.event.inputs.force_deploy == 'true' }}
      run: |
        # Only run on force deploy — incremental kubectl apply is preferred
        helm uninstall oms-nest-staging -n ${{ env.K8S_NAMESPACE }} || true
        kubectl delete deployments,services,statefulsets,configmaps,ingress,hpa --all -n ${{ env.K8S_NAMESPACE }} || true
        kubectl wait --for=delete pods --all -n ${{ env.K8S_NAMESPACE }} --timeout=120s || true

    - name: Install sealed-secrets controller
      run: |
        helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets || true
        helm repo update
        helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets \
          --namespace kube-system \
          --set-string fullnameOverride=sealed-secrets-controller \
          --wait --timeout 120s

    - name: Apply SealedSecret from Git
      run: |
        kubectl apply -f kubernetes/staging-v2/sealed-secret.yaml

    - name: Wait for secret to be unsealed
      run: |
        echo "Waiting for sealed-secrets controller to decrypt oms-app-secrets..."
        for i in $(seq 1 30); do
          if kubectl get secret oms-app-secrets -n ${{ env.K8S_NAMESPACE }} > /dev/null 2>&1; then
            echo "oms-app-secrets decrypted successfully"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "::error::Timed out waiting for oms-app-secrets to be unsealed"
            kubectl get sealedsecret -n ${{ env.K8S_NAMESPACE }} -o yaml || true
            exit 1
          fi
          sleep 5
        done

    - name: Create registry credentials
      run: |
        kubectl create secret docker-registry registry-credentials \
          --namespace=${{ env.K8S_NAMESPACE }} \
          --docker-server=${{ env.REGISTRY }} \
          --docker-username=${{ github.actor }} \
          --docker-password=${{ secrets.GITHUB_TOKEN }} \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Verify secrets exist
      run: |
        echo "Verifying Kubernetes secrets exist..."
        for secret in oms-app-secrets registry-credentials; do
          if kubectl get secret "$secret" -n ${{ env.K8S_NAMESPACE }} > /dev/null 2>&1; then
            echo "  $secret [OK]"
          else
            echo "::error::Secret $secret was not found"
            exit 1
          fi
        done

    - name: Update image tags in K8s manifests
      run: |
        cd kubernetes/staging-v2

        # Update backend image tag
        sed -i "s|ghcr.io/YOUR_ORG/oms-backend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:staging-latest|g" backend-deployment.yaml

        # Update frontend image tag
        sed -i "s|ghcr.io/YOUR_ORG/oms-frontend:latest|${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:staging-latest|g" frontend-deployment.yaml

    - name: Deploy Redis cache
      run: kubectl apply -f kubernetes/staging-v2/database-deployment.yaml

    - name: Wait for Redis to be ready
      run: |
        kubectl wait --namespace=${{ env.K8S_NAMESPACE }} \
          --for=condition=ready pod \
          --selector=app=oms-redis \
          --timeout=300s

    - name: Deploy backend application
      run: kubectl apply -f kubernetes/staging-v2/backend-deployment.yaml

    - name: Wait for backend to be ready
      run: |
        kubectl rollout status deployment/oms-backend \
          --namespace=${{ env.K8S_NAMESPACE }} \
          --timeout=300s

    - name: Deploy frontend application
      run: kubectl apply -f kubernetes/staging-v2/frontend-deployment.yaml

    - name: Wait for frontend to be ready
      run: |
        kubectl rollout status deployment/oms-frontend \
          --namespace=${{ env.K8S_NAMESPACE }} \
          --timeout=300s

    - name: Deploy ingress configuration
      run: kubectl apply -f kubernetes/staging-v2/ingress.yaml

    # Note: Migrations are run externally on the PostgreSQL database
    # The production container doesn't have dev dependencies (env-cmd)

    - name: Verify deployment
      run: |
        kubectl get pods --namespace=${{ env.K8S_NAMESPACE }}
        kubectl get services --namespace=${{ env.K8S_NAMESPACE }}
        kubectl get ingress --namespace=${{ env.K8S_NAMESPACE }}

    - name: Wait for services to be reachable
      run: |
        echo "Waiting for ingress and TLS to be ready..."

        # Wait for backend API health endpoint
        for i in $(seq 1 60); do
          if curl -sf --max-time 5 https://api-nest-staging.ordermysaddle.com/api/health > /dev/null 2>&1; then
            echo "✅ Backend API is reachable"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "::error::Backend API not reachable after 5 minutes"
            exit 1
          fi
          echo "⏳ Waiting for backend API (attempt $i/60)..."
          sleep 5
        done

        # Wait for frontend
        for i in $(seq 1 60); do
          if curl -sf --max-time 5 https://next-staging.ordermysaddle.com > /dev/null 2>&1; then
            echo "✅ Frontend is reachable"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "::error::Frontend not reachable after 5 minutes"
            exit 1
          fi
          echo "⏳ Waiting for frontend (attempt $i/60)..."
          sleep 5
        done

        echo "✅ All services are reachable"

  # E2E tests against deployed staging environment
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    defaults:
      run:
        working-directory: ./e2e

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    # kubectl access for creating/deleting test users in the staging database
    - name: Configure kubectl for DigitalOcean
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Setup Kubernetes context
      run: doctl kubernetes cluster kubeconfig save k8s-1-28-6-do-0-ams3-1713552913551
      working-directory: .

    - name: Generate E2E test passwords
      id: e2e-creds
      run: |
        E2E_ADMIN_PASSWORD="$(openssl rand -hex 16)Aa1@"
        E2E_FITTER_PASSWORD="$(openssl rand -hex 16)Ft1@"
        echo "::add-mask::$E2E_ADMIN_PASSWORD"
        echo "::add-mask::$E2E_FITTER_PASSWORD"
        echo "E2E_ADMIN_PASSWORD=$E2E_ADMIN_PASSWORD" >> "$GITHUB_OUTPUT"
        echo "E2E_FITTER_PASSWORD=$E2E_FITTER_PASSWORD" >> "$GITHUB_OUTPUT"

    - name: Create E2E test users on staging
      working-directory: .
      run: |
        POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=oms-backend -o jsonpath='{.items[0].metadata.name}')
        echo "Using backend pod: $POD"
        kubectl exec -n ${{ env.K8S_NAMESPACE }} "$POD" -- node -e "
          const bcrypt = require('bcryptjs');
          const { Client } = require('pg');
          const c = new Client({
            host: process.env.DATABASE_HOST,
            port: parseInt(process.env.DATABASE_PORT || '5432'),
            user: process.env.DATABASE_USERNAME,
            password: process.env.DATABASE_PASSWORD,
            database: process.env.DATABASE_NAME,
            ssl: { rejectUnauthorized: false }
          });
          (async () => {
            await c.connect();
            const adminHash = await bcrypt.hash('${{ steps.e2e-creds.outputs.E2E_ADMIN_PASSWORD }}', 10);
            const fitterHash = await bcrypt.hash('${{ steps.e2e-creds.outputs.E2E_FITTER_PASSWORD }}', 10);
            await c.query(
              'INSERT INTO credentials (user_name, password_hash, full_name, user_type, last_login, password_reset_hash, blocked, deleted) VALUES (\$1,\$2,\$3,\$4,0,\\'\\',0,0) ON CONFLICT (user_name) DO UPDATE SET password_hash = EXCLUDED.password_hash, blocked = 0, deleted = 0',
              ['e2e-admin@test.com', adminHash, 'E2E Admin', 2]
            );
            await c.query(
              'INSERT INTO credentials (user_name, password_hash, full_name, user_type, last_login, password_reset_hash, blocked, deleted) VALUES (\$1,\$2,\$3,\$4,0,\\'\\',0,0) ON CONFLICT (user_name) DO UPDATE SET password_hash = EXCLUDED.password_hash, blocked = 0, deleted = 0',
              ['e2e-fitter@test.com', fitterHash, 'E2E Fitter', 1]
            );
            await c.end();
            console.log('E2E test users created/updated with random passwords');
          })().catch(e => { console.error('Failed to create test users:', e.message); process.exit(1); });
        "

    - name: Run E2E tests
      # NOTE: Staging E2E tests are smoke/readonly only (enforced by playwright.config.ts grep filter)
      run: npx playwright test
      env:
        ENVIRONMENT: staging
        STAGING_BASE_URL: https://next-staging.ordermysaddle.com
        STAGING_API_URL: https://api-nest-staging.ordermysaddle.com
        TEST_ADMIN_EMAIL: e2e-admin@test.com
        TEST_ADMIN_PASSWORD: ${{ steps.e2e-creds.outputs.E2E_ADMIN_PASSWORD }}
        TEST_FITTER_EMAIL: e2e-fitter@test.com
        TEST_FITTER_PASSWORD: ${{ steps.e2e-creds.outputs.E2E_FITTER_PASSWORD }}

    - name: Delete E2E test users from staging
      if: always()
      working-directory: .
      run: |
        POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=oms-backend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
        if [ -z "$POD" ]; then
          echo "No backend pod found, skipping cleanup"
          exit 0
        fi
        echo "Cleaning up test users from pod: $POD"
        kubectl exec -n ${{ env.K8S_NAMESPACE }} "$POD" -- node -e "
          const { Client } = require('pg');
          const c = new Client({
            host: process.env.DATABASE_HOST,
            port: parseInt(process.env.DATABASE_PORT || '5432'),
            user: process.env.DATABASE_USERNAME,
            password: process.env.DATABASE_PASSWORD,
            database: process.env.DATABASE_NAME,
            ssl: { rejectUnauthorized: false }
          });
          (async () => {
            await c.connect();
            const result = await c.query(
              'DELETE FROM credentials WHERE user_name IN (\$1, \$2)',
              ['e2e-admin@test.com', 'e2e-fitter@test.com']
            );
            console.log('Deleted', result.rowCount, 'E2E test users');
            await c.end();
          })().catch(e => { console.error('Failed to delete test users:', e.message); process.exit(1); });
        " || echo "Warning: test user cleanup failed (non-fatal)"

    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: e2e/test-results/
        retention-days: 7

  # Slack notification
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-staging, e2e-tests]
    if: always()

    steps:
    - name: Notify Slack on success
      if: needs.deploy-staging.result == 'success' && needs.e2e-tests.result == 'success'
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '🚀 OMS Staging deployment successful! All E2E tests passed.'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Notify Slack on failure
      if: needs.deploy-staging.result == 'failure' || needs.e2e-tests.result == 'failure'
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '❌ OMS Staging deployment failed! Check logs for details.'
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}