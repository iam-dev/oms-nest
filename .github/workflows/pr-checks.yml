name: PR Quality Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened]

jobs:
  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality & Standards

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend code quality
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend linting
        working-directory: backend
        run: npm run lint

      - name: Backend type checking
        working-directory: backend
        run: npx tsc --noEmit

      - name: Backend tests with coverage
        working-directory: backend
        run: npm run test:cov
        env:
          NODE_ENV: test

      # Frontend code quality
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend linting
        working-directory: frontend
        run: npm run lint

      - name: Frontend type checking
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm test -- --coverage

      - name: Frontend build validation
        working-directory: frontend
        run: npm run build

  # Security and dependency checks
  security-checks:
    runs-on: ubuntu-latest
    name: Security Analysis
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Backend security audit
        working-directory: backend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Frontend security audit
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v4
        with:
          languages: typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # API contract validation
  api-validation:
    runs-on: ubuntu-latest
    name: API Contract Validation

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oms_test
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start backend server
        working-directory: backend
        run: |
          npm run start:dev &
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health/ready | grep -q "200"; then
              echo "Backend is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Backend failed to start within 60 attempts"
              exit 1
            fi
            echo "Attempt $i: Backend not ready yet, waiting 5s..."
            sleep 5
          done
        env:
          DATABASE_URL: postgresql://oms:test_password@localhost:5432/oms_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PORT: 3001
          FILE_DRIVER: local
          AUTH_JWT_SECRET: ci-test-jwt-secret
          AUTH_JWT_TOKEN_EXPIRES_IN: 15m
          AUTH_REFRESH_SECRET: ci-test-refresh-secret
          AUTH_REFRESH_TOKEN_EXPIRES_IN: 7d
          AUTH_FORGOT_SECRET: ci-test-forgot-secret
          AUTH_FORGOT_TOKEN_EXPIRES_IN: 30m
          AUTH_CONFIRM_EMAIL_SECRET: ci-test-confirm-secret
          AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
          MAIL_HOST: localhost
          MAIL_DEFAULT_EMAIL: test@example.com
          MAIL_DEFAULT_NAME: OMS Test
          MAIL_IGNORE_TLS: 'true'
          MAIL_SECURE: 'false'
          MAIL_REQUIRE_TLS: 'false'

      - name: Validate API endpoints
        run: |
          # Health check
          curl -f http://localhost:3001/api/health

          # Test core API endpoints (all versioned under /api/v1/)
          echo "Testing core endpoints..."

          # Test customers endpoint (should require auth)
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/customers)
          if [ "$RESPONSE" -eq 401 ]; then
            echo "✅ Customers endpoint correctly requires authentication"
          else
            echo "❌ Customers endpoint security issue: HTTP $RESPONSE"
            exit 1
          fi

          # Test orders endpoint
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/orders)
          if [ "$RESPONSE" -eq 401 ]; then
            echo "✅ Orders endpoint correctly requires authentication"
          else
            echo "❌ Orders endpoint security issue: HTTP $RESPONSE"
            exit 1
          fi

          # Test enriched orders endpoint
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/enriched_orders)
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 401 ]; then
            echo "✅ Enriched orders endpoint accessible"
          else
            echo "❌ Enriched orders endpoint issue: HTTP $RESPONSE"
            exit 1
          fi

  # Performance regression testing
  performance-check:
    runs-on: ubuntu-latest
    name: Performance Regression Test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oms_test
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies and start backend
        working-directory: backend
        run: |
          npm ci
          npm run start:dev &
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health/ready | grep -q "200"; then
              echo "Backend is ready!"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "Backend failed to start within 60 attempts"
              exit 1
            fi
            echo "Attempt $i: Backend not ready yet, waiting 5s..."
            sleep 5
          done
        env:
          DATABASE_URL: postgresql://oms:test_password@localhost:5432/oms_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PORT: 3001
          FILE_DRIVER: local
          AUTH_JWT_SECRET: ci-test-jwt-secret
          AUTH_JWT_TOKEN_EXPIRES_IN: 15m
          AUTH_REFRESH_SECRET: ci-test-refresh-secret
          AUTH_REFRESH_TOKEN_EXPIRES_IN: 7d
          AUTH_FORGOT_SECRET: ci-test-forgot-secret
          AUTH_FORGOT_TOKEN_EXPIRES_IN: 30m
          AUTH_CONFIRM_EMAIL_SECRET: ci-test-confirm-secret
          AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
          MAIL_HOST: localhost
          MAIL_DEFAULT_EMAIL: test@example.com
          MAIL_DEFAULT_NAME: OMS Test
          MAIL_IGNORE_TLS: 'true'
          MAIL_SECURE: 'false'
          MAIL_REQUIRE_TLS: 'false'

      - name: Basic performance validation
        run: |
          echo "🚀 Running basic performance checks..."

          # Health endpoint should respond quickly
          HEALTH_TIME=$(curl -w "%{time_total}" -s -o /dev/null http://localhost:3001/api/health)
          echo "Health endpoint response time: ${HEALTH_TIME}s"

          # Validate health check is under 0.1 seconds
          if (( $(echo "$HEALTH_TIME > 0.1" | bc -l) )); then
            echo "⚠️ Warning: Health check response time > 100ms"
          else
            echo "✅ Health check performance acceptable"
          fi

          # Test enriched orders endpoint performance
          ORDERS_TIME=$(curl -w "%{time_total}" -s -o /dev/null http://localhost:3001/api/v1/enriched_orders?limit=10)
          echo "Enriched orders endpoint response time: ${ORDERS_TIME}s"

          if (( $(echo "$ORDERS_TIME > 0.5" | bc -l) )); then
            echo "⚠️ Warning: Enriched orders response time > 500ms"
          else
            echo "✅ Enriched orders performance acceptable"
          fi

  # Documentation checks
  documentation-check:
    runs-on: ubuntu-latest
    name: Documentation Validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required documentation
        run: |
          echo "📚 Validating documentation..."

          # Check for required files
          required_files=(
            "README.md"
          )

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ Found: $file"
            else
              echo "❌ Missing: $file"
              exit 1
            fi
          done

      - name: Validate markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md #node_modules'

  # PR summary comment
  pr-summary:
    runs-on: ubuntu-latest
    name: PR Summary
    needs: [code-quality, security-checks, api-validation, performance-check, documentation-check]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Comment PR with results
        uses: actions/github-script@v7
        with:
          script: |
            const jobResults = {
              'code-quality': '${{ needs.code-quality.result }}',
              'security-checks': '${{ needs.security-checks.result }}',
              'api-validation': '${{ needs.api-validation.result }}',
              'performance-check': '${{ needs.performance-check.result }}',
              'documentation-check': '${{ needs.documentation-check.result }}'
            };

            let summary = "## PR Quality Check Results\n\n";

            for (const [job, result] of Object.entries(jobResults)) {
              const icon = result === 'success' ? 'PASS' : result === 'failure' ? 'FAIL' : 'WARN';
              const status = result.charAt(0).toUpperCase() + result.slice(1);
              summary += `**${icon}** **${job.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase())}**: ${status}\n`;
            }

            const allPassed = Object.values(jobResults).every(result => result === 'success');

            if (allPassed) {
              summary += "\n**All checks passed!** This PR is ready for review.";
            } else {
              summary += "\n**Some checks failed.** Please review the failed checks above.";
            }

            summary += "\n\n---\n*Automated by OMS CI/CD Pipeline*";

            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });