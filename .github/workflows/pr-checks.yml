name: PR Quality Checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, reopened]

# WF-029: minimum permissions at workflow level; jobs that need broader access
# declare their own permissions block (security-checks: security-events write,
# pr-summary: pull-requests write).
permissions:
  contents: read

jobs:
  # Code quality checks
  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality & Standards

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend code quality
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend linting
        working-directory: backend
        run: npm run lint

      - name: Backend type checking
        working-directory: backend
        run: npx tsc --noEmit

      - name: Backend tests with coverage
        working-directory: backend
        run: npm run test:cov
        env:
          NODE_ENV: test

      # Frontend code quality
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend linting
        working-directory: frontend
        run: npm run lint

      - name: Frontend type checking
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend tests with coverage
        working-directory: frontend
        run: npm test -- --coverage

      - name: Frontend build validation
        working-directory: frontend
        run: npm run build

  # Security and dependency checks
  security-checks:
    runs-on: ubuntu-latest
    name: Security Analysis
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Backend security audit
        working-directory: backend
        run: |
          npm ci
          # WF-021: audit-level raised from critical to high
          npm audit --omit=dev --audit-level=high

      - name: Frontend security audit
        working-directory: frontend
        run: |
          npm ci
          # WF-021: audit-level raised from critical to high
          npm audit --omit=dev --audit-level=high

      # WF-017: CodeQL removed here — codeql.yml is the canonical workflow.
      # Running it inline caused triple execution on every PR to staging/main.

  # API contract validation
  api-validation:
    runs-on: ubuntu-latest
    name: API Contract Validation

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oms_test
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Start backend server
        working-directory: backend
        # WF-022: TODO(WF-022): start:dev used here; evaluate switching to start:prod
        # once CI env vars and build artefacts are confirmed compatible.
        # WF-024: trap EXIT so the background process is killed if a later step exits early.
        run: |
          _cleanup() { kill "$(cat backend.pid 2>/dev/null)" 2>/dev/null || true; }
          trap _cleanup EXIT
          npm run start:dev &
          echo $! > backend.pid
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health/ready | grep -q "200"; then
              echo "Backend is ready!"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Backend failed to start within 60 attempts"
              exit 1
            fi
            echo "Attempt $i: Backend not ready yet, waiting 5s..."
            sleep 5
          done
        env:
          DATABASE_URL: postgresql://oms:test_password@localhost:5432/oms_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PORT: 3001
          # BE-007: MailService.onModuleInit rejects undefined/malformed URL.
          FRONTEND_DOMAIN: http://localhost:3000
          FILE_DRIVER: local
          AUTH_JWT_SECRET: ci-test-jwt-secret
          AUTH_JWT_TOKEN_EXPIRES_IN: 15m
          AUTH_REFRESH_SECRET: ci-test-refresh-secret
          AUTH_REFRESH_TOKEN_EXPIRES_IN: 7d
          AUTH_FORGOT_SECRET: ci-test-forgot-secret
          AUTH_FORGOT_TOKEN_EXPIRES_IN: 30m
          AUTH_CONFIRM_EMAIL_SECRET: ci-test-confirm-secret
          AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
          MAIL_HOST: localhost
          MAIL_DEFAULT_EMAIL: test@example.com
          MAIL_DEFAULT_NAME: OMS Test
          MAIL_IGNORE_TLS: 'true'
          MAIL_SECURE: 'false'
          MAIL_REQUIRE_TLS: 'false'

      - name: Validate API endpoints
        run: |
          # Health check
          curl -f http://localhost:3001/api/health

          # Test core API endpoints (all versioned under /api/v1/)
          echo "Testing core endpoints..."

          # Test customers endpoint (should require auth)
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/customers)
          if [ "$RESPONSE" -eq 401 ]; then
            echo "✅ Customers endpoint correctly requires authentication"
          else
            echo "❌ Customers endpoint security issue: HTTP $RESPONSE"
            exit 1
          fi

          # Test orders endpoint
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/orders)
          if [ "$RESPONSE" -eq 401 ]; then
            echo "✅ Orders endpoint correctly requires authentication"
          else
            echo "❌ Orders endpoint security issue: HTTP $RESPONSE"
            exit 1
          fi

          # Test enriched orders endpoint
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/v1/enriched_orders)
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 401 ]; then
            echo "✅ Enriched orders endpoint accessible"
          else
            echo "❌ Enriched orders endpoint issue: HTTP $RESPONSE"
            exit 1
          fi

  # Performance regression testing
  performance-check:
    runs-on: ubuntu-latest
    name: Performance Regression Test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oms_test
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies and start backend
        working-directory: backend
        # WF-022: TODO(WF-022): start:dev used here; evaluate switching to start:prod
        # once CI env vars and build artefacts are confirmed compatible.
        # WF-024: trap EXIT so the background process is killed if a later step exits early.
        run: |
          _cleanup() { kill "$(cat backend.pid 2>/dev/null)" 2>/dev/null || true; }
          trap _cleanup EXIT
          npm ci
          npm run start:dev &
          echo $! > backend.pid
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health/ready | grep -q "200"; then
              echo "Backend is ready!"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Backend failed to start within 60 attempts"
              exit 1
            fi
            echo "Attempt $i: Backend not ready yet, waiting 5s..."
            sleep 5
          done
        env:
          DATABASE_URL: postgresql://oms:test_password@localhost:5432/oms_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PORT: 3001
          # BE-007: MailService.onModuleInit rejects undefined/malformed URL.
          FRONTEND_DOMAIN: http://localhost:3000
          FILE_DRIVER: local
          AUTH_JWT_SECRET: ci-test-jwt-secret
          AUTH_JWT_TOKEN_EXPIRES_IN: 15m
          AUTH_REFRESH_SECRET: ci-test-refresh-secret
          AUTH_REFRESH_TOKEN_EXPIRES_IN: 7d
          AUTH_FORGOT_SECRET: ci-test-forgot-secret
          AUTH_FORGOT_TOKEN_EXPIRES_IN: 30m
          AUTH_CONFIRM_EMAIL_SECRET: ci-test-confirm-secret
          AUTH_CONFIRM_EMAIL_TOKEN_EXPIRES_IN: 1d
          MAIL_HOST: localhost
          MAIL_DEFAULT_EMAIL: test@example.com
          MAIL_DEFAULT_NAME: OMS Test
          MAIL_IGNORE_TLS: 'true'
          MAIL_SECURE: 'false'
          MAIL_REQUIRE_TLS: 'false'

      - name: Basic performance validation
        run: |
          echo "🚀 Running basic performance checks..."

          # Health endpoint should respond quickly
          HEALTH_TIME=$(curl -w "%{time_total}" -s -o /dev/null http://localhost:3001/api/health)
          echo "Health endpoint response time: ${HEALTH_TIME}s"

          # Validate health check is under 0.1 seconds
          if (( $(echo "$HEALTH_TIME > 0.1" | bc -l) )); then
            echo "⚠️ Warning: Health check response time > 100ms"
          else
            echo "✅ Health check performance acceptable"
          fi

          # Test enriched orders endpoint performance
          ORDERS_TIME=$(curl -w "%{time_total}" -s -o /dev/null http://localhost:3001/api/v1/enriched_orders?limit=10)
          echo "Enriched orders endpoint response time: ${ORDERS_TIME}s"

          if (( $(echo "$ORDERS_TIME > 0.5" | bc -l) )); then
            echo "⚠️ Warning: Enriched orders response time > 500ms"
          else
            echo "✅ Enriched orders performance acceptable"
          fi

  # Documentation checks
  documentation-check:
    runs-on: ubuntu-latest
    name: Documentation Validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check required documentation
        run: |
          echo "📚 Validating documentation..."

          # Check for required files
          required_files=(
            "README.md"
          )

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ Found: $file"
            else
              echo "❌ Missing: $file"
              exit 1
            fi
          done

      - name: Validate markdown files
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md #node_modules'

  # PR summary comment
  pr-summary:
    runs-on: ubuntu-latest
    name: PR Summary
    needs: [code-quality, security-checks, api-validation, performance-check, documentation-check]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Build PR summary message
        id: build-summary
        # Construct summary as a multi-line env var to avoid expression injection
        # (job result values come from trusted github context, but we still keep
        #  them in an env var to follow safe-patterns convention).
        env:
          RESULT_CODE_QUALITY: ${{ needs.code-quality.result }}
          RESULT_SECURITY: ${{ needs.security-checks.result }}
          RESULT_API: ${{ needs.api-validation.result }}
          RESULT_PERF: ${{ needs.performance-check.result }}
          RESULT_DOCS: ${{ needs.documentation-check.result }}
        run: |
          icon() { [ "$1" = "success" ] && echo "PASS" || { [ "$1" = "failure" ] && echo "FAIL" || echo "WARN"; }; }
          SUMMARY="## PR Quality Check Results

          | Check | Result |
          |---|---|
          | Code Quality | $(icon "$RESULT_CODE_QUALITY") $RESULT_CODE_QUALITY |
          | Security Checks | $(icon "$RESULT_SECURITY") $RESULT_SECURITY |
          | API Validation | $(icon "$RESULT_API") $RESULT_API |
          | Performance Check | $(icon "$RESULT_PERF") $RESULT_PERF |
          | Documentation Check | $(icon "$RESULT_DOCS") $RESULT_DOCS |

          ---
          *Automated by OMS CI/CD Pipeline*"
          # Write to GITHUB_OUTPUT using heredoc to handle newlines
          {
            echo "summary<<__EOF__"
            echo "$SUMMARY"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Sticky PR comment with results
        # WF-027: replaced github-script (appends new comment each run) with
        # sticky-pull-request-comment which edits the existing bot comment.
        # TODO(WF-010): pin this action to a specific commit SHA once the team
        # has validated the current v2 tag behaviour.
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-quality-checks
          message: ${{ steps.build-summary.outputs.summary }}