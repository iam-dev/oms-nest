title = "Dirigent Gitleaks Configuration"

# Extend the default gitleaks rules (160+ secret patterns)
[extend]
useDefault = true

# ─── Custom Rules ──────────────────────────────────────

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-[a-zA-Z0-9_\-]{20,}'''
tags = ["anthropic", "api-key"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key (legacy and new formats)"
regex = '''sk-[a-zA-Z0-9]{20,}T3BlbkFJ[a-zA-Z0-9]{20,}|sk-proj-[a-zA-Z0-9_\-]{40,}'''
tags = ["openai", "api-key"]

[[rules]]
id = "vercel-token"
description = "Vercel Token"
regex = '''(?i)vercel[_\s]*token\s*[:=]\s*['"]?[a-zA-Z0-9]{24,}['"]?'''
tags = ["vercel", "token"]

[[rules]]
id = "supabase-service-role-key"
description = "Supabase Service Role Key (detected by assignment context, not just JWT shape)"
regex = '''(?i)(supabase|service.?role|SUPABASE_SERVICE_ROLE)[_\s]*(key|token|secret)?\s*[:=]\s*['"]?eyJ[a-zA-Z0-9_\-]+\.[a-zA-Z0-9_\-]+\.[a-zA-Z0-9_\-]+['"]?'''
tags = ["supabase", "jwt", "service-role"]

[[rules]]
id = "generic-high-entropy"
description = "High entropy string that looks like a secret"
regex = '''(?i)(secret|password|passwd|token|api_key|apikey|auth)\s*[:=]\s*['"][a-zA-Z0-9/+=]{20,}['"]'''
tags = ["generic", "high-entropy"]
entropy = 4.0

[[rules]]
id = "connection-string"
description = "Database connection string with password"
regex = '''(?i)(postgres|mysql|mongodb|redis):\/\/[^:]+:[^@]+@'''
tags = ["database", "connection-string"]

# ─── Allowlist ─────────────────────────────────────────

[allowlist]
description = "Allowlist for known safe patterns"
paths = [
  '''\.env\.example$''',
  '''\.env\.template$''',
  '''\.env\.sample$''',
  '''test[s]?/fixtures/''',
  '''__mocks__/''',
  '''\.gitleaks\.toml$''',
  '''scripts/security-scan\.sh$''',
  '''SKILL\.md$''',
  '''\.snap$''',
  # Bitnami SealedSecrets — values are asymmetrically encrypted ciphertext, not plaintext
  '''kubernetes/staging/sealed-secret\.yaml$''',
  '''kubernetes/staging-v2/sealed-secret\.yaml$''',
  # CI/CD workflows — contain only localhost test credentials (oms:test_password)
  '''\.github/workflows/ci-cd\.yml$''',
  '''\.github/workflows/pr-checks\.yml$''',
  '''\.github/workflows/staging-deployment\.yml$''',
  # Documentation — example curl commands and placeholder API keys
  '''docs/api-reference\.md$''',
  '''README\.md$''',
  '''QUICK_START\.md$''',
  '''IMPLEMENTATION_SUMMARY\.md$''',
  '''backend/docs/installing-and-running\.md$''',
  # Test files — mock/test tokens
  '''frontend/middleware\.ts$''',
  '''frontend/tests/''',
  # E2E and test scripts — local test credentials only
  '''scripts/run-e2e-local\.sh$''',
  '''backend/test/e2e-api/scripts/'''
]
