# Default shared values for oms-nest Helm chart
# Override per environment in values-staging.yaml / values-production.yaml

global:
  environment: production
  imagePullSecrets:
    - name: registry-credentials

backend:
  image:
    repository: ghcr.io/iam-dev/oms-nest-backend
    tag: latest
    pullPolicy: Always
  port: 3001
  replicas: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1000m"
      memory: 1Gi
  probes:
    liveness:
      path: /api/health/live
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /api/health/ready
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startup:
      path: /api/health/live
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 18
  migration:
    enabled: true
    command: ["npm", "run", "migration:run"]

frontend:
  image:
    repository: ghcr.io/iam-dev/oms-nest-frontend
    tag: latest
    pullPolicy: Always
  port: 3000
  replicas: 1
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: false
    size: 2Gi
    storageClass: do-block-storage

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  frontend:
    host: nest-staging.ordermysaddle.com
  backend:
    host: api-nest-staging.ordermysaddle.com
  tls:
    secretName: oms-nest-staging-tls

secrets:
  name: oms-nest-secrets

# Bitnami Sealed Secrets integration.
# When enabled, secrets are encrypted and safe to commit to Git.
# Requires sealed-secrets controller installed in the cluster.
# See templates/sealed-secrets.yaml for setup instructions.
sealedSecrets:
  enabled: false
  # Populate encryptedData by running: kubeseal --fetch-cert | kubeseal --format yaml
  # Example (these are NOT real values):
  # encryptedData:
  #   DATABASE_HOST: AgBxxxxx...
  #   DATABASE_PASSWORD: AgByyyyy...
  encryptedData: {}

# RBAC for secret access control.
# Creates dedicated ServiceAccounts for backend/frontend pods
# and restricts secret access to only the application secret.
rbac:
  enabled: true

networkPolicies:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
  port: 3001

prometheusRules:
  enabled: true

maildev:
  enabled: false
  image:
    repository: maildev/maildev
    tag: latest
  ports:
    web: 1080
    smtp: 1025
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
