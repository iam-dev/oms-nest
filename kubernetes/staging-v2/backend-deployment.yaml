apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-backend
  namespace: oms-nest-staging
  labels:
    app: oms-backend
    component: api
    environment: staging
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: oms-backend
  template:
    metadata:
      labels:
        app: oms-backend
        component: api
        environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      # Keep app workloads on the regular app pool. The pool-634m1k6jz-build
      # pool's only node has a malfunctioning Cilium CNI agent that fails
      # pod sandbox creation (cilium-cni: Cilium API client timeout exceeded).
      # TODO(WF-019): This hard-coded node-pool pin should move to a Helm value
      # (e.g. nodeSelector: {{ .Values.nodeSelectorPool }}) or be replaced with
      # a taint/toleration approach so it survives node-pool name changes.
      nodeSelector:
        doks.digitalocean.com/node-pool: pool-psxen27q2
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
      - name: oms-backend
        image: ghcr.io/YOUR_ORG/oms-backend:latest  # Will be overridden by CI/CD
        imagePullPolicy: Always

        ports:
        - containerPort: 3001
          name: http
          protocol: TCP

        env:
        - name: PORT
          value: "3001"

        # Secrets from Kubernetes secrets (NO hardcoded values)
        # NODE_ENV is set in oms-app-secrets sealed secret
        envFrom:
        - secretRef:
            name: oms-app-secrets

        # Resource limits for security and stability
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          # WF-030: enabled readOnlyRootFilesystem; /tmp and /app/.cache are
          # covered by the emptyDir volumeMounts below, so the app has write
          # access to the paths it actually needs.
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

        # Health checks (paths include /api global prefix)
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        # Startup probe for slower initial startup
        startupProbe:
          httpGet:
            path: /api/health/live
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18

        # Temporary filesystem mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /app/.cache

      volumes:
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}

      # Image is public, no imagePullSecrets needed

      # Pod security
      automountServiceAccountToken: false

---
apiVersion: v1
kind: Service
metadata:
  name: oms-backend-service
  namespace: oms-nest-staging
  labels:
    app: oms-backend
    component: api
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: oms-backend

# WF-018: HPA removed. With minReplicas=maxReplicas=1 it was a no-op and
# created a race condition with kubectl rollout restart (HPA could fight the
# rollout controller). Re-add with meaningful min/max bounds if autoscaling
# is required in future.