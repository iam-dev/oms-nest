# SECRETS TEMPLATE - NO ACTUAL SECRETS HERE
# This file contains the structure for secrets but NO actual values.
# Actual secrets will be created by CI/CD pipeline from environment variables.
#
# WF-011 OPERATOR NOTE: DATABASE_REJECT_UNAUTHORIZED must be "true" in production
# deployments. When regenerating secrets-plain.yaml (gitignored), ensure:
#   DATABASE_SSL_ENABLED: "true"
#   DATABASE_REJECT_UNAUTHORIZED: "true"
#   DATABASE_CA: "<base64-encoded PEM of the DB CA certificate>"
# The backend reads these via backend/src/database/data-source.ts (extra.ssl block).

apiVersion: v1
kind: Secret
metadata:
  name: oms-app-secrets
  namespace: oms-nest-staging
  labels:
    app: oms
    environment: staging
type: Opaque
stringData:
  # Database connection (injected from CI/CD)
  DATABASE_URL: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)"

  # JWT configuration (injected from CI/CD)
  JWT_SECRET: "$(JWT_SECRET_KEY)"
  JWT_EXPIRES_IN: "$(JWT_EXPIRES_IN)"

  # Redis connection (injected from CI/CD)
  REDIS_URL: "redis://$(REDIS_HOST):6379"

  # Application secrets (injected from CI/CD)
  ENCRYPTION_SECRET: "$(ENCRYPTION_SECRET)"

  # CORS configuration
  CORS_ORIGINS: "https://next-staging.ordermysaddle.com"

  # API configuration
  API_PORT: "3001"
  NODE_ENV: "staging"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: oms-nest-staging
  labels:
    app: postgres
    environment: staging
type: Opaque
stringData:
  # PostgreSQL configuration (injected from CI/CD)
  POSTGRES_USER: "$(DB_USERNAME)"
  POSTGRES_PASSWORD: "$(DB_PASSWORD)"
  POSTGRES_DB: "$(DB_NAME)"

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: oms-nest-staging
  labels:
    app: redis
    environment: staging
type: Opaque
stringData:
  # Redis configuration (injected from CI/CD)
  REDIS_PASSWORD: "$(REDIS_PASSWORD)"

---
# Image pull secrets (for private registries)
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: oms-nest-staging
type: kubernetes.io/dockerconfigjson
data:
  # This will be injected by CI/CD pipeline
  .dockerconfigjson: "$(DOCKER_CONFIG_JSON)"