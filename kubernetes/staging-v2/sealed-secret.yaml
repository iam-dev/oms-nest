# Bitnami Sealed Secret for OMS Staging V2
#
# This file should contain a SealedSecret resource that the sealed-secrets
# controller decrypts into the "oms-app-secrets" Kubernetes Secret at runtime.
# The encrypted data is safe to commit to Git.
#
# PREREQUISITES:
#   1. Install the sealed-secrets controller on the cluster (done by the CI workflow):
#        helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#        helm upgrade --install sealed-secrets sealed-secrets/sealed-secrets \
#          --namespace kube-system \
#          --set-string fullnameOverride=sealed-secrets-controller
#
#   2. Install the kubeseal CLI locally:
#        brew install kubeseal
#
# GENERATE THIS FILE:
#   1. Copy the env template and fill in real values:
#        cp kube/secrets.env.example kube/secrets.env
#
#   2. Seal the secrets (kubectl must point to the target cluster):
#        ./kube/scripts/manage-secrets.sh seal oms-staging-v2 kube/secrets.env \
#          --name oms-app-secrets --output kubernetes/staging-v2
#
#   3. Commit the generated file (this placeholder will be overwritten):
#        git add kubernetes/staging-v2/sealed-secret.yaml && git commit
#
# ROTATION:
#   Re-run the seal command above whenever secret values change or when
#   the controller's signing key rotates (default: every 30 days).
#
# ---
# Replace this comment block with the output of the seal command above.
# The generated YAML will look like:
#
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: oms-app-secrets
#   namespace: oms-staging-v2
# spec:
#   encryptedData:
#     DATABASE_HOST: AgBy3i4OJSWK+PiT...
#     ...
#   template:
#     metadata:
#       name: oms-app-secrets
#       namespace: oms-staging-v2
#     type: Opaque
