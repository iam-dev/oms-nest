apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-frontend
  namespace: oms-nest-staging
  labels:
    app: oms-frontend
    component: web
    environment: staging
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: oms-frontend
  template:
    metadata:
      labels:
        app: oms-frontend
        component: web
        environment: staging
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      # Keep app workloads on the regular app pool. The pool-634m1k6jz-build
      # pool's only node has a malfunctioning Cilium CNI agent that fails
      # pod sandbox creation (cilium-cni: Cilium API client timeout exceeded).
      # TODO(WF-019): This hard-coded node-pool pin should move to a Helm value
      # (e.g. nodeSelector: {{ .Values.nodeSelectorPool }}) or be replaced with
      # a taint/toleration approach so it survives node-pool name changes.
      nodeSelector:
        doks.digitalocean.com/node-pool: pool-psxen27q2
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
      - name: oms-frontend
        image: ghcr.io/iam-dev/oms-nest-frontend:staging-latest
        imagePullPolicy: Always

        ports:
        - containerPort: 3000
          name: http
          protocol: TCP

        env:
        # WF-031: NODE_ENV removed here so the SealedSecret value wins.
        # Explicit env entries override secretRef values in the same pod spec,
        # which prevented the sealed-secret from controlling NODE_ENV.
        - name: PORT
          value: "3000"
        - name: NEXT_PUBLIC_API_URL
          value: "https://api-nest-staging.ordermysaddle.com"
        - name: NEXTAUTH_URL
          value: "https://next-staging.ordermysaddle.com"
        # Frontend middleware verifies the httpOnly `token` cookie with JWT_SECRET.
        # It must be the SAME secret the backend signs with (AUTH_JWT_SECRET), or
        # middleware fails closed and every protected route bounces to /login.
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: oms-app-secrets
              key: AUTH_JWT_SECRET

        # Secrets from Kubernetes secrets (NO hardcoded values)
        envFrom:
        - secretRef:
            name: oms-app-secrets

        # Resource limits for security and stability
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"

        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL

        # Health checks
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        # Startup probe for slower initial startup
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12

        # Temporary filesystem mounts
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: next-cache
          mountPath: /app/.next/cache
        - name: uploads
          mountPath: /app/public/uploads

      volumes:
      - name: tmp
        emptyDir: {}
      - name: next-cache
        emptyDir: {}
      - name: uploads
        emptyDir: {}

      # Image is public, no imagePullSecrets needed

      # Pod security
      automountServiceAccountToken: false

---
apiVersion: v1
kind: Service
metadata:
  name: oms-frontend-service
  namespace: oms-nest-staging
  labels:
    app: oms-frontend
    component: web
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: oms-frontend

# WF-018: HPA removed. With minReplicas=maxReplicas=1 it was a no-op and
# created a race condition with kubectl rollout restart (HPA could fight the
# rollout controller). Re-add with meaningful min/max bounds if autoscaling
# is required in future.