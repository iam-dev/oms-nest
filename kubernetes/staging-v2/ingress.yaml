apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oms-nest-staging-ingress
  namespace: oms-nest-staging
  labels:
    app: oms
    environment: staging
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Security headers (CSP is managed by Next.js — do not duplicate here)
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit-connections: "20"
    nginx.ingress.kubernetes.io/rate-limit-requests-per-minute: "300"

    # CORS settings
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://next-staging.ordermysaddle.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Pragma,Expires,x-custom-lang"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # TLS and certificate management
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Request size limits
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/client-max-body-size: "50m"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

spec:
  ingressClassName: nginx

  tls:
  - hosts:
    - next-staging.ordermysaddle.com
    - api-nest-staging.ordermysaddle.com
    secretName: oms-nest-staging-tls-cert

  rules:
  # Frontend routing
  - host: next-staging.ordermysaddle.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oms-frontend-service
            port:
              number: 80

  # Backend API routing
  - host: api-nest-staging.ordermysaddle.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oms-backend-service
            port:
              number: 80

---
# Certificate Issuer for Let's Encrypt (production - trusted certificates)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    environment: staging
spec:
  acme:
    # ACME server for Let's Encrypt production (trusted certificates)
    server: https://acme-v02.api.letsencrypt.org/directory

    # Email address for important account notifications
    email: devops@ordermysaddle.com

    # Private key secret ref
    privateKeySecretRef:
      name: letsencrypt-prod-private-key

    # ACME challenge solver
    solvers:
    - http01:
        ingress:
          class: nginx

---
# Load Balancer Service for external access (if needed)
apiVersion: v1
kind: Service
metadata:
  name: oms-nest-staging-loadbalancer
  namespace: oms-nest-staging
  labels:
    app: oms
    environment: staging
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-enable-proxy-protocol: "true"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-check-interval-seconds: "10"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-healthy-threshold: "2"
    service.beta.kubernetes.io/do-loadbalancer-healthcheck-unhealthy-threshold: "3"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  selector:
    app: nginx-ingress
    component: controller