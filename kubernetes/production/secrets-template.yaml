# SECRETS TEMPLATE - NO ACTUAL SECRETS HERE
# This file contains the structure for secrets but NO actual values.
# Use `kubeseal` to create the actual sealed-secret.yaml with real production credentials.
#
# Example:
#   kubectl create secret generic oms-app-secrets \
#     --namespace=oms-nest-production \
#     --from-literal=DATABASE_URL="postgresql://..." \
#     --dry-run=client -o yaml | kubeseal --format yaml > sealed-secret.yaml

apiVersion: v1
kind: Secret
metadata:
  name: oms-app-secrets
  namespace: oms-nest-production
  labels:
    app: oms
    environment: production
type: Opaque
stringData:
  # Database connection (injected from CI/CD)
  DATABASE_URL: "postgresql://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):25060/$(DB_NAME)?sslmode=require"

  # JWT configuration (injected from CI/CD)
  # NOTE: JWT_SECRET is intentionally NOT defined here. It previously mapped to
  # JWT_SECRET_KEY, which is NOT the secret the backend signs tokens with, so
  # the frontend middleware could never verify a session. The frontend now
  # sources JWT_SECRET directly from AUTH_JWT_SECRET via secretKeyRef in
  # frontend-deployment.yaml — keep it in exactly one place.
  JWT_EXPIRES_IN: "24h"

  # Redis connection (injected from CI/CD)
  REDIS_URL: "redis://$(REDIS_HOST):6379"

  # Application secrets (injected from CI/CD)
  ENCRYPTION_SECRET: "$(ENCRYPTION_SECRET)"

  # API configuration
  API_PORT: "3001"
  NODE_ENV: "production"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: oms-nest-production
  labels:
    app: postgres
    environment: production
type: Opaque
stringData:
  # PostgreSQL configuration (injected from CI/CD)
  POSTGRES_USER: "$(DB_USERNAME)"
  POSTGRES_PASSWORD: "$(DB_PASSWORD)"
  POSTGRES_DB: "$(DB_NAME)"

---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: oms-nest-production
  labels:
    app: redis
    environment: production
type: Opaque
stringData:
  # Redis configuration (injected from CI/CD)
  REDIS_PASSWORD: "$(REDIS_PASSWORD)"

---
# Image pull secrets (for private registries)
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: oms-nest-production
type: kubernetes.io/dockerconfigjson
data:
  # This will be injected by CI/CD pipeline
  .dockerconfigjson: "$(DOCKER_CONFIG_JSON)"
